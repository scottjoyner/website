name: Static server security regressions
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  static-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test server.test.js
